name: Bug report
description: The tool does something wrong, or fails.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Logs help most. Remove anything private (addresses, tokens, push URLs) before posting.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What the tool did, or failed to do, and when.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: What the limit, the charging or the log should have shown.
    validations:
      required: true
  - type: input
    id: evcc-version
    attributes:
      label: evcc version
      placeholder: "0.319.1"
    validations:
      required: true
  - type: input
    id: tool-version
    attributes:
      label: evcc-smart-limit version
      description: The image tag you run, e.g. 0.4 or 0.4.0.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Tariff and slot length, vehicle and charger (with phases and maximum current), and how evcc gets the charge level.
    validations:
      required: true
  - type: dropdown
    id: dry-run
    attributes:
      label: Was DRY_RUN on?
      options:
        - "Yes, nothing was written to evcc"
        - "No, it was setting the limit"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: 'Output of docker logs evcc-smart-limit around the problem. One decision line appears every 15 minutes, plus one on each plug-in or limit change.'
      render: text
    validations:
      required: true
