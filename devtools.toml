# Shared build tooling from jmerhar/devtools, fetched into .devtools/ by bin/devtools-fetch.sh.
[fetch]
ref = "v1"
files = [
  "make/devtools.mk",
  "config/ruff.toml",
  "bin/lint.sh",
  "bin/ci-ruff.sh",
  "bin/check-compose.sh",
  "bin/version.py",
  "bin/release.sh",
  "bin/github-release.sh",
  "bin/ci.py",
  "fetch/devtools-fetch.sh",
  "bin/devtools-check.py",
]
coverage = true

# Every check `make lint` runs.
[lint]
checks = ["shellcheck", "ruff", "version", "compose", "devtools"]
ruff = "backend/.venv/bin/ruff"

# Each combination of compose files that is run, validated by `make lint` and CI.
[compose]
stacks = [
  ["docker-compose.yml"],
  ["docker-compose.yml", "docker-compose.build.yml"],
]

# Where the release version is written; the compose file follows the image's release line.
[version]
pyprojects = ["backend/pyproject.toml"]
images = ["ghcr.io/jmerhar/evcc-smart-limit"]

[release]
title = "evcc-smart-limit"

# CI, run by jmerhar/devtools' python-docker-app.yml (.github/workflows/ci.yml): each suite is a job,
# the image is built once all of them and the coverage gate pass, and a version tag gets its GitHub
# release.
[ci]
junit = ["backend/junit/*.xml"]
coverage_description = "Backend HTML coverage report"

[[ci.suite]]
name = "backend"
python = true
install = 'pip install -e "backend[test]"'
run = "bin/test-backend.sh -v --junitxml=junit/backend.xml --cov=evcc_smart_limit --cov-report=term-missing --cov-report=xml --cov-report=json --cov-report=html"
env = { PYTHON = "python" }
coverage = ["backend/coverage.xml", "backend/coverage.json", "backend/htmlcov", "backend/junit"]

[[ci.suite]]
name = "lint"
python = true
install = "pip install ruff"
run = ".devtools/bin/lint.sh"
env = { RUFF = "ruff" }

[[ci.image]]
image = "ghcr.io/jmerhar/evcc-smart-limit"

# .github/dependabot.yml, generated from these by `make devtools-fix`: GitHub Actions, then the
# update below. It takes a release once it is three days old, in one weekly pull request of minor
# and patch releases and another of majors, which waits for a hand migration. A pull request builds
# the image, so a dependency that breaks it fails there.
[[dependabot.update]]
ecosystem = "pip"
directory = "/backend"
group = "backend"
comment = "The backend's declared ranges and pins; jigkit, which is ours, is taken at once."

# The files the coverage suite's Codecov flag covers (codecov.yml, generated by `make devtools-fix`).
[codecov.paths]
backend = ["backend/"]
