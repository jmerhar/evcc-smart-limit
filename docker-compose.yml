# evcc-smart-limit, as one service. Add it to the compose file evcc runs in (or see README.md for
# other setups). This file stands alone: `docker compose up -d` next to it is enough to try it.
services:
  evcc-smart-limit:
    image: ghcr.io/jmerhar/evcc-smart-limit:0.2
    container_name: evcc-smart-limit
    restart: unless-stopped
    environment:
      # Where this container reaches evcc: its service name in the same compose file.
      EVCC_URL: ${EVCC_URL:-http://evcc:7070}
      # The charging point, counted from 1 in the order evcc's main page shows them.
      LOADPOINT: ${LOADPOINT:-1}
      TZ: ${TZ:-UTC}
      # Logs what it would set without changing evcc. Set it to false once the log looks right.
      DRY_RUN: ${DRY_RUN:-true}
      # Optional: an emptying car accepts higher prices, any price at the floor. See README.md.
      URGENCY_START: ${URGENCY_START:-}
      URGENCY_FLOOR: ${URGENCY_FLOOR:-}
    volumes:
      # Its memory (the limit it last set, a manual-override pause). A named volume, so it starts
      # out writable by the container's user.
      - smart-limit-data:/data
    # Nothing in the image is written at run time apart from /data.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

volumes:
  smart-limit-data:
